
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highfield Egypt Learning Portal | تسجيل الدخول</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Cairo:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="portal.css">
</head>

<body data-page="login">
  <main class="card">
    <p class="brand">HIGHFIELD <span>EGYPT LEARNING PORTAL</span></p>

    <h1>دخول المتدربين</h1>
    <p>بوابتك التعليمية لمتابعة البرامج والتسجيلات والمدفوعات والشهادات.</p>

    <label>
      الاسم بالكامل (عند إنشاء حساب جديد)
      <input id="fullName" type="text" autocomplete="name">
    </label>

    <label>
      البريد الإلكتروني
      <input id="email" type="email" autocomplete="email">
    </label>

    <label>
      كلمة المرور
      <input id="password" type="password" autocomplete="current-password">
    </label>

    <button id="emailLogin">دخول بالبريد الإلكتروني</button>

    <button id="googleLogin" class="secondary">
      المتابعة باستخدام Google
    </button>

    <div class="split">
      <button id="signup" class="link">إنشاء حساب</button>
      <button id="resetPassword" class="link">نسيت كلمة المرور؟</button>
    </div>

    <p id="status" class="status" role="status"></p>

    <p class="note">
      إنشاء الحساب لا يعني اعتماد الاشتراك. تفعيل لوحة المتدرب يتطلب موافقة الإدارة.
    </p>

    <a href="annual-medical-program.html">العودة لصفحة البرنامج</a>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module" src="portal.js"></script>
</body>
</html>
